[project]
name = "kdp-book"
version = "0.1.0"
description = "Fully-automated KDP book pipeline — concept → manuscript → illustrations → KDP-ready PDF/EPUB, powered by Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click",
    "httpx",
    "agent-framework==1.2.0",
    "agent-framework-openai==1.2.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "reportlab>=4.0",
    "ebooklib>=0.18",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "filelock>=3.13",
    "tenacity>=8.2",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.scripts]
kdp-book = "kdp_book.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kdp_book"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, isolated unit tests (default in CI)",
    "smoke: end-to-end smoke tests, no external API calls",
    "integration: tests that touch real Azure services (cost money, skipped in CI)",
    "image: tests that hit gpt-image-2 (cost money, skipped in CI)",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.380",
]
